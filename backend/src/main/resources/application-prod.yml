spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${postgres}
    password: ${postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 最初は update / 検証できたら validate でもOK
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.example: DEBUG   # パッケージ合わせて調整

# CORS（フロントが別オリジンの場合）
cors:
  allowed-origins: "https://your-frontend-domain.example, http://localhost:5173"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
